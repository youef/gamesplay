<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وعد تحت النجوم | فيلم أنمي</title><style>*{box-sizing:border-box}body{margin:0;background:#09091e;color:white;font-family:system-ui;overflow:hidden}.scene{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#0c0a31 0%,#48276b 47%,#e888a6 75%,#29284c 100%)}.stars{position:absolute;inset:0;background-image:radial-gradient(white 1px,transparent 2px);background-size:83px 71px;opacity:.6;animation:twinkle 3s infinite alternate}.moon{position:absolute;top:10%;right:15%;width:120px;aspect-ratio:1;border-radius:50%;background:#fff2df;box-shadow:0 0 50px 15px #ffdbef88;animation:glow 4s infinite alternate}.mountain{position:absolute;bottom:20%;width:120%;height:32%;left:-10%;background:#27234e;clip-path:polygon(0 100%,0 75%,12% 38%,25% 78%,42% 15%,62% 81%,76% 35%,100% 83%,100% 100%)}.lake{position:absolute;bottom:0;width:100%;height:23%;background:linear-gradient(#443467,#14152e);box-shadow:0 -8px 35px #ffd5ef55}.lake:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 12px,#ffbce51a 13px 15px);animation:water 4s linear infinite}.tree{position:absolute;left:-3%;bottom:16%;font-size:min(32vw,300px);filter:drop-shadow(0 5px 20px #ff95ce);animation:sway 5s ease-in-out infinite alternate}.characters{position:absolute;bottom:17%;left:50%;transform:translateX(-50%);display:flex;gap:40px;align-items:end;filter:drop-shadow(0 7px 14px #0008)}.person{position:relative;width:70px;height:190px;animation:breathe 3s infinite alternate}.head{position:absolute;top:0;left:13px;width:48px;height:55px;border-radius:45% 45% 50% 50%;background:#ffd4bc;box-shadow:0 -14px 0 3px #252038}.eye{position:absolute;top:28px;width:5px;height:8px;border-radius:50%;background:#28213d}.eye.a{left:15px}.eye.b{right:15px}.body{position:absolute;top:56px;left:9px;width:55px;height:82px;border-radius:14px 14px 5px 5px;background:#f2e6ef}.legs{position:absolute;top:133px;left:16px;width:14px;height:58px;background:#1b1930;box-shadow:24px 0 #1b1930}.boy .body{background:#253455}.girl .body{background:#fff0ef}.girl .head{box-shadow:0 -15px 0 7px #38243c}.arm{position:absolute;top:62px;left:-3px;width:12px;height:65px;border-radius:12px;background:#ffd4bc;transform-origin:top;animation:wave 3s ease-in-out infinite alternate}.petal{position:absolute;top:-10%;width:12px;height:8px;border-radius:100% 0 100% 0;background:#ffb7d9;animation:fall linear infinite;pointer-events:none}.overlay{position:absolute;inset:0;background:linear-gradient(transparent 62%,#08091dc9);pointer-events:none}.ui{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);width:min(94%,700px);text-align:center}.title{font-size:clamp(22px,5vw,38px);text-shadow:0 3px 16px #000;margin:0 0 12px}.dialog{min-height:65px;font-size:clamp(16px,3vw,23px);line-height:1.8}.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}button{background:#ffffff24;color:white;border:1px solid #ffffff66;border-radius:30px;padding:11px 20px;cursor:pointer;font-size:15px;backdrop-filter:blur(12px)}button:hover{background:#ffffff55}.bar{width:min(90%,440px);height:5px;border-radius:5px;background:#ffffff55;margin:16px auto;overflow:hidden}.progress{height:100%;background:#ffd5e7;width:0}small{opacity:.8}@keyframes fall{to{transform:translate(130px,110vh) rotate(720deg)}}@keyframes glow{to{box-shadow:0 0 95px 28px #ffdbefaa}}@keyframes sway{to{transform:rotate(3deg)}}@keyframes breathe{to{transform:translateY(-5px)}}@keyframes wave{to{transform:rotate(28deg)}}@keyframes twinkle{to{opacity:.25}}@keyframes water{to{transform:translateY(15px)}}@media(max-width:500px){.characters{gap:15px;transform:translateX(-50%) scale(.85);transform-origin:bottom}.tree{font-size:180px}.moon{width:85px}.ui{bottom:3%}}</style></head><body><main class="scene" id="scene"><div class="stars"></div><div class="moon"></div><div class="mountain"></div><div class="lake"></div><div class="tree">🌸</div><div class="characters"><div class="person boy"><div class="head"><i class="eye a"></i><i class="eye b"></i></div><div class="body"></div><div class="legs"></div><div class="arm"></div></div><div class="person girl"><div class="head"><i class="eye a"></i><i class="eye b"></i></div><div class="body"></div><div class="legs"></div><div class="arm"></div></div></div><div class="overlay"></div><section class="ui"><h1 class="title">وعد تحت النجوم</h1><div class="dialog" id="dialog">حين تلتقي القلوب تحت ضوء القمر...</div><small id="counter">00:00 / 00:46</small><div class="bar"><div class="progress" id="progress"></div></div><div class="controls"><button id="play">▶ تشغيل الفيلم</button><button id="restart">↻ إعادة</button><button id="sound">♫ صوت: إيقاف</button><button id="full">⛶ ملء الشاشة</button></div></section></main><script>const lines=['حين تلتقي القلوب تحت ضوء القمر...','هي: هل تعتقد أن النجوم تحفظ أمنياتنا؟','هو: أظن أنها تحفظ الوعود أيضًا.','هي: حتى الوعود التي نخاف أن نقولها؟','هو: خصوصًا تلك التي تسكن القلب.','هي: إذن عدني ألا تنسى هذا المساء.','هو: أعدك... ما دامت السماء تحمل نجمة.'];const duration=46;let t=0,playing=false,last=0,ctx=null,osc=null;const el=id=>document.getElementById(id);for(let i=0;i<35;i++){let p=document.createElement('i');p.className='petal';p.style.left=Math.random()*100+'%';p.style.animationDuration=5+Math.random()*9+'s';p.style.animationDelay=-Math.random()*14+'s';p.style.opacity=.3+Math.random()*.7;el('scene').append(p)}function draw(){el('dialog').textContent=lines[Math.min(lines.length-1,Math.floor(t/duration*lines.length))];el('progress').style.width=(t/duration*100)+'%';el('counter').textContent='00:'+String(Math.floor(t)).padStart(2,'0')+' / 00:46';el('play').textContent=playing?'Ⅱ إيقاف مؤقت':'▶ تشغيل الفيلم'}function frame(now){if(playing){if(last)t+=(now-last)/1000;last=now;if(t>=duration){t=duration;playing=false;last=0}draw()}requestAnimationFrame(frame)}requestAnimationFrame(frame);el('play').onclick=()=>{if(t>=duration)t=0;playing=!playing;last=0;draw()};el('restart').onclick=()=>{t=0;playing=true;last=0;draw()};el('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};el('sound').onclick=()=>{if(osc){osc.stop();osc.disconnect();osc=null;el('sound').textContent='♫ صوت: إيقاف';return}ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();osc=ctx.createOscillator();let g=ctx.createGain();osc.type='sine';osc.frequency.value=220;g.gain.value=.018;osc.connect(g).connect(ctx.destination);osc.start();el('sound').textContent='♫ صوت: تشغيل'};draw();</script></body></html>
