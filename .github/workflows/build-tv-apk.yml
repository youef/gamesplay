name: Build Abtal Al Huroof Android TV APK
on:
  push:
    branches: [ main, 'feature/abtal-*' ]
    paths:
      - 'abtal-alhuroof-tv/**'
      - '.github/workflows/build-tv-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Android 4.4 compatible APK
        working-directory: abtal-alhuroof-tv
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Abtal-AlHuroof-TV-Android-4.4-APK
          path: abtal-alhuroof-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
