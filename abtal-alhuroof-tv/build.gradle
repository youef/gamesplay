buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Same Android Gradle Plugin line used by the working Al Ezz TV legacy build.
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
