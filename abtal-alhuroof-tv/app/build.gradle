apply plugin: 'com.android.application'

android {
    namespace 'sa.youef.abtalalhuroof'
    compileSdkVersion 33
    buildToolsVersion '33.0.2'
    defaultConfig {
        applicationId 'sa.youef.abtalacademy.tv'
        minSdkVersion 19
        targetSdkVersion 31
        versionCode 10
        versionName '2.1.0-safeinstall-tv'
        // No native libraries: one universal APK runs on ARMv7/ARM64/x86/x86_64.
    }
    signingConfigs {
        debug {
            // Crucial for Android KitKat / API19 and matching Al Ezz TV.
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        debug {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled false
            // Use a persistent private release keystore for real upgrade support.
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
