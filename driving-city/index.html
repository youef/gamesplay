<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>مدينة القيادة 3D</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui;background:#9ed6ef}canvas{display:block}#hud{position:fixed;top:12px;right:12px;color:white;background:#122f3dcc;padding:12px 16px;border-radius:14px;line-height:1.9;z-index:3}button{border:0;border-radius:13px;background:#047857;color:white;font-weight:700;padding:14px;touch-action:none}#enter{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);z-index:3}#touch{position:fixed;bottom:90px;left:15px;display:grid;grid-template-columns:repeat(3,55px);gap:6px;direction:ltr;z-index:3}#touch button{background:#173d4de0;font-size:22px}#touch [data-k=w]{grid-column:2}#touch [data-k=a]{grid-column:1}#touch [data-k=s]{grid-column:2}#touch [data-k=d]{grid-column:3}#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#123a47ba;color:#fff;padding:8px 12px;border-radius:10px;font-size:12px;white-space:nowrap;z-index:3}@media(pointer:fine){#touch{display:none}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"}}</script></head><body><div id="hud">مدينة القيادة ثلاثية الأبعاد<div id="mode">الوضع: مشي</div><div id="speed">السرعة: 0 كم/س</div></div><button id="enter">اركب السيارة E</button><div id="touch"><button data-k="w">↑</button><button data-k="a">←</button><button data-k="s">↓</button><button data-k="d">→</button></div><div id="help">WASD للحركة · E ركوب/نزول · اسحب لتدوير الكاميرا</div><script type="module">
import * as T from 'three';
const scene=new T.Scene();scene.background=new T.Color('#9fd5f0');scene.fog=new T.Fog('#9fd5f0',100,230);
const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,500),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x718071,2));const sun=new T.DirectionalLight(0xffffff,2.1);sun.position.set(45,90,35);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-130;sun.shadow.camera.right=130;sun.shadow.camera.top=130;sun.shadow.camera.bottom=-130;scene.add(sun);
const material=c=>new T.MeshStandardMaterial({color:c});const grass=material(0x78aa72),road=material(0x374047),walk=material(0xbcbdb5),stripe=material(0xf4df94);
function cube(parent,w,h,d,x,y,z,m){let o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
cube(scene,500,.2,500,0,-.2,0,grass);for(let i=-3;i<=3;i++){cube(scene,12,.08,450,i*45,0,0,road);cube(scene,450,.08,12,0,0,i*45,road);cube(scene,2,.12,450,i*45-8,.01,0,walk);cube(scene,2,.12,450,i*45+8,.01,0,walk);for(let j=-9;j<=9;j++){cube(scene,.2,.08,2,i*45,.07,j*22,stripe);cube(scene,2,.08,.2,j*22,.07,i*45,stripe)}}
const colors=[0xd7aa80,0x9cbac5,0xe1d3b3,0xaaa9c3];for(let x=-3;x<3;x++)for(let z=-3;z<3;z++){const xx=x*45+22.5,zz=z*45+22.5,h=8+Math.random()*18;cube(scene,17,h,17,xx,h/2,zz,material(colors[Math.floor(Math.random()*colors.length)]));for(let y=3;y<h-1;y+=3.6)for(let a=-6;a<=6;a+=4)cube(scene,2,1.5,.08,xx+a,y,zz-8.54,material(0x41647b))}
const person=new T.Group();scene.add(person);cube(person,.8,1,.45,0,1.35,0,material(0x146e8c));const head=new T.Mesh(new T.SphereGeometry(.3,14,12),material(0xd5a77f));head.position.y=2.12;person.add(head);for(const x of [-.22,.22])cube(person,.25,.85,.28,x,.45,0,material(0x273348));
const car=new T.Group();scene.add(car);car.position.set(3,0,0);cube(car,2.15,.85,4.3,0,.9,0,material(0x1b6487));cube(car,1.75,.72,2.2,0,1.65,-.2,material(0x365569));for(const x of [-1.12,1.12])for(const z of [-1.35,1.35]){const wheel=new T.Mesh(new T.CylinderGeometry(.42,.42,.26,18),material(0x1a1b1e));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.46,z);car.add(wheel)}for(const x of [-.72,.72]){cube(car,.35,.23,.08,x,1.05,-2.18,material(0xf5f4db));cube(car,.35,.23,.08,x,1.05,2.18,material(0xd42c2c))}
let driving=false,heading=0,velocity=0,camYaw=0,drag=null;const keys={},enter=document.getElementById('enter');function toggle(){if(!driving&&person.position.distanceTo(car.position)>5.5)return;driving=!driving;person.visible=!driving;if(!driving){person.position.copy(car.position).add(new T.Vector3(2,0,0));velocity=0}document.getElementById('mode').textContent='الوضع: '+(driving?'قيادة':'مشي');enter.textContent=driving?'انزل من السيارة E':'اركب السيارة E'}enter.onclick=toggle;addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='e'&&!e.repeat)toggle()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});renderer.domElement.addEventListener('pointerdown',e=>drag=e.clientX);renderer.domElement.addEventListener('pointermove',e=>{if(drag!==null){camYaw+=(e.clientX-drag)*.005;drag=e.clientX}});for(const ev of ['pointerup','pointercancel'])renderer.domElement.addEventListener(ev,()=>drag=null);
const clock=new T.Clock();function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05),f=+(keys.w||keys.arrowup)-+(keys.s||keys.arrowdown),t=+(keys.a||keys.arrowleft)-+(keys.d||keys.arrowright);if(driving){velocity=T.MathUtils.damp(velocity,f*16,2,dt);heading+=t*dt*1.35*(velocity>=0?1:-1);car.rotation.y=heading;car.position.x-=Math.sin(heading)*velocity*dt;car.position.z-=Math.cos(heading)*velocity*dt}else{heading+=t*dt*2.4;person.rotation.y=heading;velocity=f*5;person.position.x-=Math.sin(heading)*velocity*dt;person.position.z-=Math.cos(heading)*velocity*dt}const target=driving?car:person;target.position.x=T.MathUtils.clamp(target.position.x,-215,215);target.position.z=T.MathUtils.clamp(target.position.z,-215,215);const a=heading+camYaw,dist=driving?11:6;camera.position.lerp(target.position.clone().add(new T.Vector3(Math.sin(a)*dist,driving?6:4,Math.cos(a)*dist)),Math.min(1,dt*5));camera.lookAt(target.position.x,1.3,target.position.z);document.getElementById('speed').textContent='السرعة: '+Math.round(Math.abs(velocity)*3.6)+' كم/س';enter.style.display=driving||person.position.distanceTo(car.position)<5.5?'block':'none';renderer.render(scene,camera)}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
